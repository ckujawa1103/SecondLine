<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1211" />
    <!-- No third-party scripts anywhere in this app, so the CSP can be strict.
         That is the mitigation for keeping the session token in localStorage. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:;
               style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';
               base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>SecondLine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
